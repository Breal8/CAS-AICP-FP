<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6e6e8a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c8b8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6e6e8a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a0a0c0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8b8ff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c8b8ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#a0a0c0" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Left face silhouette (facing right) -->
  <path d="M20 14 C16 18 14 24 15 30 C15 36 17 40 20 43 L20 50 L29 50 L29 14 Z"
        fill="url(#leftFace)"/>

  <!-- Right face silhouette (mirror, facing left) -->
  <path d="M44 14 C48 18 50 24 49 30 C49 36 47 40 44 43 L44 50 L35 50 L35 14 Z"
        fill="url(#rightFace)"/>

  <!-- Centre mirror line -->
  <line x1="32" y1="11" x2="32" y2="53"
        stroke="url(#glow)" stroke-width="1.5" filter="url(#softglow)"/>

  <!-- Top cap dot -->
  <circle cx="32" cy="11" r="1.5" fill="#c8b8ff" opacity="0.8"/>
  <!-- Bottom cap dot -->
  <circle cx="32" cy="53" r="1.5" fill="#c8b8ff" opacity="0.5"/>
</svg>
